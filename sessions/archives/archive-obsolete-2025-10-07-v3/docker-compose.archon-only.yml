# Test Archon seul avec Redis - Version ultra-rapide

services:
  # Redis (base nécessaire)
  redis:
    image: redis:7-alpine
    container_name: archon_redis_only
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - archon_network

  # Archon Orchestrator (version simplifiée)
  archon-orchestrator:
    build:
      context: .
      dockerfile: docker/archon/Dockerfile.simple
    container_name: archon_main_only
    environment:
      - NODE_ENV=test
      - MCP_PORT=3456
      - LOG_LEVEL=debug
      - REDIS_URL=redis://redis:6379
      - GITHUB_PAT=${GITHUB_PAT}
      - GITHUB_MCP_ENABLED=false
      - JULES_MCP_ENABLED=false
    ports:
      - "3457:3456"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - archon_network

networks:
  archon_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16

volumes:
  redis_data:
    driver: local