name: CI - [PROJECT_NAME]

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: [NODE_VERSION]
          cache: 'pnpm'

      - name: Install dependencies
        run: [PACKAGE_MANAGER] install

      - name: P0 Quality Gate - Build (BLOCKER)
        run: [BUILD_COMMAND]

      - name: P1 Quality Gate - Lint
        run: [LINT_COMMAND]

      - name: P2 Quality Gate - Test
        run: [TEST_COMMAND]
        continue-on-error: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ job.status }}';
            const body = buildStatus === 'success'
              ? '✅ All quality gates passed (P0: Build ✅, P1: Lint ✅). Ready for review.'
              : '⚠️ Some quality gates failed. Check logs above for details.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
